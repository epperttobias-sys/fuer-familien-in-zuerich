name: Events sammeln

on:
  schedule:
    - cron: "17 2 * * *" # jede Nacht um 02.17 Uhr UTC
  workflow_dispatch: # von Hand starten
  push:
    branches: [main]
    paths: ["collect/collect.mjs", "collect/lib.mjs", "collect/gemeinden.json", "collect/merge.mjs"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  bezirk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bezirk: [Affoltern, Andelfingen, Bülach, Dielsdorf, Dietikon, Hinwil, Horgen, Meilen, Pfäffikon, Uster, Winterthur, Zürich, eventitem, Quellen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/collect.mjs
        env:
          BEZIRK: ${{ matrix.bezirk }}
      - uses: actions/upload-artifact@v4
        with:
          name: teil-${{ strategy.job-index }}
          path: |
            data/parts/
            data/cache-*.json
          retention-days: 2

  zusammen:
    needs: bezirk
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: teil-*
          path: data
          merge-multiple: true
      - run: node --test test/lib.test.mjs
      - run: node collect/merge.mjs
      - run: node collect/wetter.mjs
        continue-on-error: true
      - name: Daten speichern
        run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf data/parts
          git add data site/events.json site/events.js
          git add site/wetter.js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Events aktualisiert"
          git pull --rebase -X theirs --autostash origin main || (git rebase --abort; git pull --no-rebase -X ours origin main)
          git push
      - name: Version stempeln (für automatische Aktualisierung)
        run: |
          v=$(date +%s)
          echo "{\"v\":\"$v\"}" > site/version.json
          sed -i "s/__APPV__/$v/" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
