name: Wochenend-Tipps (Newsletter)

on:
  schedule:
    - cron: "41 5 * * 4" # jeden Donnerstag um 05.41 Uhr UTC, nach dem nächtlichen Sammeln
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node collect/newsletter.mjs
      - name: Ausgabe speichern
        run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/newsletter site/tipps.js
          git diff --cached --quiet || git commit -m "Wochenend-Tipps aktualisiert"
          git pull --rebase -X theirs --autostash origin main
          git push
      - name: Version stempeln (für automatische Aktualisierung)
        run: |
          v=$(date +%s)
          echo "{\"v\":\"$v\"}" > site/version.json
          sed -i "s/__APPV__/$v/" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
