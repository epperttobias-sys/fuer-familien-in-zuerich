name: Einzelne Quelle sofort sammeln

on:
  workflow_dispatch:
    inputs:
      codes: { description: "Quellen-Codes, mit Komma getrennt (z. B. q-hofnarr)", required: true }

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  quelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node collect/collect.mjs
        env: { BEZIRK: Quellen, CODES: "${{ inputs.codes }}" }
      - run: node collect/patch-quelle.mjs
      - name: Daten speichern
        run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/events.json site/events.js
          git diff --cached --quiet || git commit -m "Events: Quelle ${{ inputs.codes }} aktualisiert"
          git pull --rebase -X theirs --autostash origin main
          git push
      - name: Version stempeln (für automatische Aktualisierung)
        run: |
          v=$(date +%s)
          echo "{\"v\":\"$v\"}" > site/version.json
          sed -i "s/__APPV__/$v/" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - name: Kurz warten, bis GitHub das Paket kennt
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
